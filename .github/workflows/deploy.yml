name: build-and-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx astro check
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jerryboganda/lightbox:latest
            ghcr.io/jerryboganda/lightbox:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ github.sha }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ]; then echo "VPS_SSH_KEY or VPS_HOST not set; skipping deploy."; exit 0; fi
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/id root@$HOST"
          $SSH 'mkdir -p /opt/lightbox/data /opt/lightbox/backups && chown 1000:1000 /opt/lightbox/data /opt/lightbox/backups && test -f /opt/lightbox/.env || { echo "/opt/lightbox/.env is missing"; exit 1; }'
          scp -i ~/.ssh/id deploy/compose.yml root@$HOST:/opt/lightbox/compose.yml
          printf '%s' "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u $ACTOR --password-stdin >/dev/null"
          $SSH "cd /opt/lightbox && PREV=\$(cat .tag 2>/dev/null || echo latest) && TAG=$TAG docker compose pull -q && TAG=$TAG docker compose up -d --remove-orphans && \
            for i in \$(seq 1 40); do docker exec lightbox-web node -e \"fetch('http://127.0.0.1:4321/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" && echo $TAG > .tag && docker logout ghcr.io >/dev/null && echo deployed $TAG && exit 0; sleep 3; done; \
            echo 'health check failed, rolling back to' \$PREV; TAG=\$PREV docker compose up -d; docker logout ghcr.io >/dev/null; exit 1"
